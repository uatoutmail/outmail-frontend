name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://ci-placeholder.example.com

  unit-test:
    name: unit + component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  audit-and-test:
    name: audit + test (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (report only)
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings — non-blocking, review separately"
        continue-on-error: true
      - name: Test (runs only if a test script + test files exist)
        run: |
          if npm run | grep -qE '^  test$' && find . -path ./node_modules -prune -o \( -iname '*.test.*' -o -iname '*.spec.*' \) -print -quit | grep -q .; then
            npm test || echo "::warning::tests failed but this step is non-blocking until OUT-192 test coverage lands"
          else
            echo "No test script/files yet — skipping (tracked separately under OUT-192)."
          fi
        continue-on-error: true

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release-ancestry:
    name: verify release traces back to main
    if: github.ref == 'refs/heads/release' || github.base_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify this commit shares ancestry with main
        run: |
          git fetch origin main --quiet
          MAIN_SHA=$(git rev-parse origin/main)
          HERE_SHA=$(git rev-parse HEAD)
          echo "release commit: $HERE_SHA"
          echo "main tip:       $MAIN_SHA"
          if git merge-base --is-ancestor "$HERE_SHA" "$MAIN_SHA" || git merge-base --is-ancestor "$MAIN_SHA" "$HERE_SHA"; then
            echo "PASS: this commit and main share direct ancestry (fast-forward, main merged in, or release cut from an earlier point in main's history)."
          else
            echo "::error::This commit on/into 'release' shares NO ancestry with 'main'. release must only ever be promoted FROM main (fast-forward or a real merge commit — not squash/rebase, which break this link). Investigate before anything is allowed to deploy from this commit."
            exit 1
          fi
